<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8912A"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="62%" stop-color="#F4E5C2"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="blue" cx="78%" cy="-8%" r="70%">
      <stop offset="0%" stop-color="#30489E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#30489E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="6%" cy="104%" r="62%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#D4AF37" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0A1128"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#blue)"/>
  <rect width="1200" height="630" fill="url(#warm)"/>

  <!-- mark -->
  <g transform="translate(84 78)">
    <circle cx="26" cy="26" r="21" fill="none" stroke="url(#gold)" stroke-width="5"
            stroke-linecap="round" stroke-dasharray="97 34" transform="rotate(-38 26 26)"/>
    <circle cx="26" cy="26" r="6" fill="url(#gold)"/>
  </g>
  <text x="146" y="115" font-family="Manrope,Inter,Segoe UI,sans-serif" font-size="33" font-weight="800"
        letter-spacing="-0.5" fill="url(#gold)">CERO<tspan fill="#FFFFFF" font-weight="600"> Studio</tspan></text>

  <!-- headline -->
  <text font-family="Manrope,Inter,Segoe UI,sans-serif" font-size="74" font-weight="800" letter-spacing="-2.6" fill="#FFFFFF">
    <tspan x="84" y="285">We Help Local Businesses</tspan>
    <tspan x="84" y="368" fill="url(#gold)">Never Miss Another Lead</tspan>
    <tspan x="84" y="451">With AI.</tspan>
  </text>

  <text x="84" y="514" font-family="Inter,Segoe UI,sans-serif" font-size="26" fill="#A9B3CD">
    AI voice agents · Automation · AI video for dental clinics &amp; local service brands
  </text>

  <rect x="84" y="552" width="120" height="4" rx="2" fill="url(#gold)"/>
  <text x="1116" y="558" text-anchor="end" font-family="Inter,Segoe UI,sans-serif" font-size="22"
        letter-spacing="1.5" fill="#7A8399">cerostudio.co</text>
</svg>
