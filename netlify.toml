[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML must never be cached hard: it is the file that points at every versioned
# asset, so a stale copy pins a visitor to an old build.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Canonical host: keep cerostudio.co as the single source of truth.
[[redirects]]
  from = "https://www.cerostudio.co/*"
  to = "https://cerostudio.co/:splat"
  status = 301
  force = true

# Canonical URL form: the extensionless one, which is what canonical tags,
# og:url and sitemap.xml all declare. Listed one by one on purpose. A wildcard
# would also catch google7aa936a6fd430f8b.html, and Search Console needs that
# file to stay reachable at its exact URL or verification breaks.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio.html"
  to = "/portfolio"
  status = 301
  force = true

[[redirects]]
  from = "/founder.html"
  to = "/founder"
  status = 301
  force = true

[[redirects]]
  from = "/co-founder.html"
  to = "/co-founder"
  status = 301
  force = true
